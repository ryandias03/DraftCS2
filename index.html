<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 MAJOR DRAFT — IEM Cologne 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #111318;
    --surface2: #1a1d24;
    --border: #252830;
    --accent: #e8b84b;
    --accent2: #c8973a;
    --text: #e2e6ef;
    --muted: #6b7280;
    --danger: #ef4444;
    --green: #4ade80;
    --blue: #60a5fa;
    --orange: #fb923c;
    --yellow: #facc15;
    --purple: #c084fc;
    --slate: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: rgba(10,12,16,0.95);
    backdrop-filter: blur(8px);
    z-index: 100;
  }
  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .logo span { color: var(--text); }
  .pick-counter {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .pick-counter strong { color: var(--accent); font-size: 16px; }

  /* ── PICK SLOTS HEADER ── */
  .slots-bar {
    display: flex;
    gap: 6px;
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    overflow-x: auto;
  }
  .slot-pill {
    flex: 1;
    min-width: 100px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    text-align: center;
    transition: all 0.2s;
  }
  .slot-pill.filled {
    border-color: var(--accent);
    background: rgba(232,184,75,0.08);
  }
  .slot-pill .slot-role {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .slot-pill .slot-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .slot-pill .slot-fp {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .slot-pill .slot-empty {
    font-size: 14px;
    color: var(--muted);
    font-style: italic;
  }

  /* ── MAIN LAYOUT ── */
  .main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  /* ── ACTIVE TEAM CARD (time sorteado) ── */
  .active-team-card {
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 28px 32px;
    margin: 28px 0 20px;
    background: linear-gradient(135deg, rgba(232,184,75,0.14) 0%, rgba(232,184,75,0.04) 100%);
    border: 2px solid rgba(232,184,75,0.5);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(232,184,75,0.18), inset 0 1px 0 rgba(255,255,255,0.06);
    animation: team-card-in 0.45s ease;
  }
  @keyframes team-card-in {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .active-team-card .at-logo-wrap {
    flex-shrink: 0;
    width: 112px;
    height: 112px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.25);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .active-team-card .at-logo {
    max-width: 96px;
    max-height: 96px;
    object-fit: contain;
    filter: drop-shadow(0 4px 14px rgba(0,0,0,0.55));
  }
  .active-team-card .at-body { flex: 1; min-width: 0; }
  .active-team-card .at-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .active-team-card .at-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text);
    line-height: 1.05;
    margin-bottom: 10px;
  }
  .active-team-card .at-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .active-team-card .at-pick-hint {
    font-size: 13px;
    color: var(--muted);
    margin-left: auto;
    text-align: right;
  }
  @media (max-width: 600px) {
    .active-team-card { flex-direction: column; text-align: center; padding: 22px; }
    .active-team-card .at-pick-hint { margin-left: 0; text-align: center; width: 100%; }
  }

  /* ── SPIN SECTION ── */
  .spin-section {
    text-align: center;
    margin-bottom: 40px;
  }
  .pick-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .team-display {
    display: none;
  }
  .team-stage-badge {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 20px;
    font-family: 'Barlow Condensed', sans-serif;
    margin-bottom: 24px;
  }
  .badge-legends { background: rgba(232,184,75,0.15); color: var(--accent); border: 1px solid rgba(232,184,75,0.3); }
  .badge-challengers { background: rgba(96,165,250,0.15); color: var(--blue); border: 1px solid rgba(96,165,250,0.3); }
  .badge-contenders { background: rgba(107,114,128,0.2); color: var(--muted); border: 1px solid rgba(107,114,128,0.3); }

  /* Roulette strip */
  .team-roulette { margin-top: 8px; display: flex; justify-content: center; }
  .roulette-window {
    width: 920px;
    max-width: 100%;
    height: 140px;
    overflow: hidden;
    position: relative;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 0;
    background: linear-gradient(180deg, rgba(26,29,36,0.95), rgba(17,19,24,0.98));
    box-shadow: inset 0 2px 20px rgba(0,0,0,0.35);
  }
  .roulette-window::before,
  .roulette-window::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 80px;
    z-index: 2;
    pointer-events: none;
  }
  .roulette-window::before {
    left: 0;
    background: linear-gradient(90deg, rgba(17,19,24,0.95), transparent);
  }
  .roulette-window::after {
    right: 0;
    background: linear-gradient(-90deg, rgba(17,19,24,0.95), transparent);
  }
  .roulette-track {
    display: flex;
    align-items: center;
    height: 100%;
    transform: translateX(0);
    will-change: transform;
  }
  .roulette-item {
    width: 220px;
    flex: 0 0 220px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    justify-content: center;
    padding: 10px 12px;
    color: var(--text);
    box-sizing: border-box;
    transition: transform 0.2s, background 0.2s;
  }
  .roulette-item:not(:first-child) {
    border-left: 1px solid rgba(255,255,255,0.05);
  }
  .roulette-item img {
    height: 76px;
    max-width: 180px;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,0.55));
    display: block;
  }
  .roulette-item .rname {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text);
    text-align: center;
    max-width: 200px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .roulette-item.selected {
    background: rgba(232,184,75,0.08);
    border-radius: 8px;
    transform: scale(1.04);
  }
  .roulette-item.selected .rname { color: var(--accent); }
  .roulette-marker {
    position: absolute;
    left: 50%;
    top: 6px;
    bottom: 6px;
    width: 4px;
    transform: translateX(-50%);
    background: linear-gradient(180deg, var(--accent), var(--accent2));
    box-shadow: 0 0 16px rgba(232,184,75,0.7);
    border-radius: 2px;
    pointer-events: none;
    z-index: 3;
  }

  .spin-controls {
    width: 920px;
    max-width: 100%;
    margin: 16px auto 0;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .spin-btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 14px 40px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .spin-btn:hover { background: var(--accent2); transform: translateY(-1px); }
  .spin-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .reroll-btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 22px;
    cursor: pointer;
    transition: all 0.15s;
    margin-left: 10px;
  }
  .reroll-btn:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
  .reroll-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .reroll-count {
    font-size: 11px;
    display: block;
    margin-top: 2px;
  }

  /* ── PLAYERS GRID ── */
  .players-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-top: 32px;
  }

  @media (max-width: 768px) {
    .players-grid { grid-template-columns: repeat(2, 1fr); }
    .team-display { font-size: 28px; }
    .slots-bar { flex-wrap: wrap; }
  }

  .player-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: all 0.2s;
    cursor: default;
    position: relative;
  }
  .player-card.available {
    cursor: pointer;
  }
  .player-card.available:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(232,184,75,0.12);
  }
  .player-card.drafted {
    opacity: 0.35;
    pointer-events: none;
  }

  .player-photo {
    width: 100%;
    aspect-ratio: 1;
    background: var(--surface2);
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .player-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }
  .player-photo-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    background: var(--surface2);
  }
  .role-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.1);
  }

  .player-info {
    padding: 12px;
  }
  .player-nick {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text);
    margin-bottom: 2px;
  }
  .player-name {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .fp-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .fp-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }
  .fp-value {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: var(--accent);
  }
  .fp-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .fp-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--accent);
    transition: width 0.4s ease;
  }

  /* ── POSITION DOTS (bolinhas) ── */
  .slot-dots {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .slot-dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    cursor: default;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    position: relative;
    flex-shrink: 0;
  }
  .slot-dot:hover {
    transform: scale(1.15);
  }
  .slot-dot.filled {
    border-color: transparent;
  }
  .slot-dot[data-role="AWPer"] { border-color: #4ade80; }
  .slot-dot[data-role="IGL"] { border-color: #60a5fa; }
  .slot-dot[data-role="Entry"] { border-color: #fb923c; }
  .slot-dot[data-role="Support"] { border-color: #facc15; }
  .slot-dot[data-role="Rifler"] { border-color: #c084fc; }
  .slot-dot[data-role="Lurker"] { border-color: #94a3b8; }
  .slot-dot[data-role="AWPer"]:hover { background: rgba(74,222,128,0.2); }
  .slot-dot[data-role="IGL"]:hover { background: rgba(96,165,250,0.2); }
  .slot-dot[data-role="Entry"]:hover { background: rgba(251,146,60,0.2); }
  .slot-dot[data-role="Support"]:hover { background: rgba(250,204,21,0.2); }
  .slot-dot[data-role="Rifler"]:hover { background: rgba(192,132,252,0.2); }
  .slot-dot[data-role="Lurker"]:hover { background: rgba(148,163,184,0.2); }

  .tooltip {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: #1a1d24;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 10px;
    white-space: nowrap;
    padding: 4px 8px;
    border-radius: 4px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.5px;
    z-index: 200;
  }
  .slot-dot:hover .tooltip { opacity: 1; }

  /* ── TOURNAMENT SIMULATOR ── */
  .tournament-simulator-section {
    padding: 0 32px 32px;
  }

  .tournament-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 30px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .tournament-header {
    margin-bottom: 24px;
    text-align: center;
  }

  .tournament-header h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .tournament-header p {
    font-size: 14px;
    color: var(--muted);
  }

  .tournament-controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .btn-simulate,
  .btn-multiple {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 24px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .btn-simulate:hover {
    border-color: var(--accent);
    background: rgba(232,184,75,0.1);
    color: var(--accent);
  }

  .btn-multiple:hover {
    border-color: var(--blue);
    background: rgba(96,165,250,0.1);
    color: var(--blue);
  }

  .tournament-results,
  .simulation-stats {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-top: 20px;
  }

  .results-header,
  .stats-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .results-header h3,
  .stats-header h3 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text);
  }

  .close-results {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 20px;
    transition: color 0.2s;
  }

  .close-results:hover {
    color: var(--text);
  }

  .results-content,
  .stats-content {
    font-size: 13px;
    line-height: 1.8;
    color: var(--text);
  }

  .tournament-match {
    background: var(--surface2);
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 12px;
    border-left: 3px solid var(--accent);
  }

  .match-stage {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .match-teams {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .team-name {
    flex: 1;
  }

  .match-score {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    min-width: 40px;
    text-align: center;
  }

  .stats-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
  }

  .stats-table th {
    background: rgba(232,184,75,0.08);
    border: 1px solid var(--border);
    padding: 10px;
    text-align: left;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--accent);
  }

  .stats-table td {
    border: 1px solid var(--border);
    padding: 10px;
    font-size: 13px;
  }

  .stats-table tr:hover {
    background: rgba(232,184,75,0.05);
  }

  .stat-pct {
    color: var(--accent);
    font-weight: 700;
  }

  /* ── SWISS SELECTION ── */
  .swiss-team-card {
    position: relative;
  }

  .swiss-team-card.your-team {
    border-color: var(--accent) !important;
    background: rgba(232,184,75,0.1) !important;
  }

  .swiss-selection-logo {
    width: 72px;
    height: 72px;
    object-fit: contain;
    display: block;
  }

  /* ── RESULT SCREEN ── */
  #result-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    z-index: 500;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #result-screen.active { display: flex; }
  #result-screen.minimized {
    inset: auto auto 20px 20px;
    width: 320px;
    height: auto;
    background: rgba(10,12,16,0.95);
    border: 1px solid var(--border);
    border-radius: 12px;
    align-items: flex-start;
    justify-content: flex-start;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    max-width: 1100px;
    width: 100%;
    text-align: center;
  }
  #result-screen.minimized .result-card {
    padding: 16px;
    border-radius: 8px;
    text-align: left;
  }
  #result-screen.minimized .result-record,
  #result-screen.minimized .result-label,
  #result-screen.minimized .result-score-detail {
    display: none;
  }

<script>
let state = {
  pick: 1,           // 1..5
  currentTeam: null,
  usedTeams: [],
  rerollsLeft: 1,
  rerolledThisRound: false,
  pickedPlayers: [],
  draftedThisRound: false,
  gameOver: false,
  selectedSwissReplacement: null,  // Equipe selecionada para substituir
  swissTeams: null,               // Times da simulação Swiss
  swissData: null,                // Dados da simulação Swiss
  playoffsData: null              // Dados dos playoffs
};

const SLOTS_CONFIG = [
  { label: "Pick 1" },
  { label: "Pick 2" },
  { label: "Pick 3" },
  { label: "Pick 4" },
  { label: "Pick 5" }
];

function getRoleColor(role) {
  const m = { AWPer:"#4ade80", IGL:"#60a5fa", Entry:"#fb923c", Support:"#facc15", Rifler:"#c084fc", Lurker:"#94a3b8" };
  return m[role] || "#6b7280";
}

function getRoleEmoji(role) {
  const m = { AWPer:"🎯", IGL:"👑", Entry:"⚡", Support:"🛡️", Rifler:"🔫", Lurker:"👤" };
  return m[role] || "•";
}

function displayRoles(player) {
  return formatPlayerRoles(player);
}

function displayRoleEmoji(player) {
  return getPlayerRoles(player).map(getRoleEmoji).join("");
}

function renderSlotsBar() {
  const bar = document.getElementById("slots-bar");
  bar.innerHTML = SLOTS_CONFIG.map((s, i) => {
    const p = state.pickedPlayers[i];
    if (p) {
      return `<div class="slot-pill filled">
        <div class="slot-role">${displayRoles(p)}</div>
        <div class="slot-name">${p.nick}</div>
        <div class="slot-fp">FP ${p.firepower}</div>
      </div>`;
    }
    const active = i === state.pick - 1;
    return `<div class="slot-pill" style="${active ? 'border-color:rgba(232,184,75,0.3)' : ''}">
      <div class="slot-role">${s.label}</div>
      <div class="slot-empty">${active ? '▶ Agora' : '—'}</div>
    </div>`;
  }).join("");
}

function renderPickedRoster() {
  const pickedEl = document.getElementById("picked-roster");
  const list = document.getElementById("picked-list");
  const slots = 5;
  if (state.pickedPlayers.length === 0) {
    pickedEl.style.display = "none";
    list.innerHTML = "";
    return;
  }
  pickedEl.style.display = "";

  // Build score bar card (spans full width at top)
  const score = calcTeamScore(state.pickedPlayers);
  const pct = Math.min(100, score);
  const scoreBarHtml = `
    <div class="score-bar-card">
      <span class="score-label">Firepower Médio</span>
      <div class="score-track"><div class="score-fill" style="width:${pct}%"></div></div>
      <span class="score-value">${score}</span>
      <span class="record-preview">${scoreToRecord(score)}</span>
    </div>
  `;

  // Render picked players as full player-card tiles to match the player grid
  const playersHtml = state.pickedPlayers.map(p => {
    const roleColor = getRoleColor(getPrimaryRole(p));
    const fpPct = p.firepower;
    const photoContent = p.photo && !p.photo.includes('placeholder')
      ? `<div class="player-photo"><img src="${p.photo}" alt="${p.nick}" referrerpolicy="no-referrer" onerror="this.parentElement.innerHTML='<div class=\\'player-photo-placeholder\\'>${displayRoleEmoji(p)}</div>'"></div>`
      : `<div class="player-photo-placeholder" style="font-size:40px">${displayRoleEmoji(p)}</div>`;

    return `
      <div class="player-card drafted">
        ${photoContent}
        <div class="player-info">
          <div class="player-nick">${p.nick}</div>
          <div class="player-name">${p.team} · ${displayRoles(p)}</div>
          <div class="fp-row"><span class="fp-label">Firepower</span><span class="fp-value">${p.firepower}</span></div>
          <div class="fp-bar"><div class="fp-bar-fill" style="width:${fpPct}%;background:${roleColor}"></div></div>
        </div>
      </div>
    `;
  }).join("");

  // Add empty placeholders for remaining slots so layout stays consistent
  let placeholdersHtml = "";
  const placeholders = Math.max(0, slots - state.pickedPlayers.length);
  for (let i = 0; i < placeholders; i++) {
    placeholdersHtml += `
      <div class="player-card" style="opacity:0.28">
        <div class="player-photo-placeholder" style="font-size:28px">—</div>
        <div class="player-info">
          <div class="player-nick">Vago</div>
          <div class="player-name" style="color:var(--muted)">Aguardando pick</div>
        </div>
      </div>
    `;
  }

  // Combine: score bar (full width) + players + placeholders
  list.innerHTML = scoreBarHtml + playersHtml + placeholdersHtml;
}

function renderPicksRow() {
  const row = document.getElementById('picks-row');
  const slots = 5;
  if (!row) return;
  if (state.pickedPlayers.length === 0) {
    row.style.display = 'none';
    return;
  }
  row.style.display = 'grid';
  row.innerHTML = Array.from({length: slots}).map((_, i) => {
    const p = state.pickedPlayers[i];
    if (!p) {
      return `<div></div>`;
    }
    const photo = p.photo && !p.photo.includes('placeholder') ? `<div class="pic"><img src="${p.photo}" alt="${p.nick}" referrerpolicy="no-referrer"></div>` : `<div class="pic"><div style="width:100%;height:100%;background:var(--surface);display:flex;align-items:center;justify-content:center">${displayRoleEmoji(p)}</div></div>`;
    return `
      <div class="slot-picked-card">
        ${photo}
        <div class="meta">
          <div class="nick">${p.nick}</div>
          <div class="team">${p.team}</div>
          <div class="fp">FP ${p.firepower}</div>
        </div>
      </div>
    `;
  }).join('');
}

function renderScoreBar() {
  // Score é agora renderizado dentro de renderPickedRoster()
  // Mas mantemos a atualização do pick counter no header
  document.getElementById("hdr-pick").textContent = state.pick;
}

function randomTeam() {
  const available = TEAMS.filter(t => !state.usedTeams.includes(t.id));
  if (available.length === 0) return null;
  return available[Math.floor(Math.random() * available.length)];
}

function shuffledTeams(teams) {
  const copy = [...teams];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function getSwissBaseTeams() {
  const swissOrder = [
    "vitality", "navi", "falcons", "mongolz",
    "parivision", "aurora", "furia", "mouz",
    "fut", "spirit", "g2", "betboom",
    "9z", "monte", "b8", "legacy"
  ];
  return swissOrder.map(id => TEAMS.find(team => team.id === id)).filter(Boolean);
}

function stageBadgeHtml(team) {
  const bc = { Legends: "badge-legends", Challengers: "badge-challengers", Contenders: "badge-contenders" };
  return `<span class="team-stage-badge ${bc[team.stage] || ""}">${team.stage} · ${team.region}</span>`;
}

function teamLogoImg(team, className) {
  if (!team.logo) return "";
  const cls = className ? ` class="${className}"` : "";
  return `<img${cls} src="${team.logo}" alt="${team.name}" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">`;
}

function renderActiveTeamCard(team) {
  const card = document.getElementById("active-team-card");
  if (!team) {
    card.style.display = "none";
    card.innerHTML = "";
    return;
  }
  card.style.display = "flex";
  card.innerHTML = `
    <div class="at-logo-wrap">${teamLogoImg(team, "at-logo")}</div>
    <div class="at-body">
      <div class="at-label">Time sorteado · Pick ${state.pick} de 5</div>
      <div class="at-name">${team.name}</div>
      <div class="at-meta">${stageBadgeHtml(team)}</div>
    </div>
    <div class="at-pick-hint">Escolha 1 jogador abaixo</div>
  `;
  card.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function showTeamOnDisplay(team) {
  renderActiveTeamCard(team);
}

function spin() {
  if (state.gameOver) return;

  const spinBtn = document.getElementById("spin-btn");
  const roulette = document.getElementById("team-roulette");
  const track = document.getElementById("roulette-track");

  spinBtn.disabled = true;
  document.getElementById("reroll-btn").disabled = true;
  state.draftedThisRound = false;
  state.rerolledThisRound = false;
  renderActiveTeamCard(null);

  const available = TEAMS.filter(t => !state.usedTeams.includes(t.id));
  if (available.length === 0) return;

  const ITEM_WIDTH = 220;
  const WINDOW_WIDTH = roulette.querySelector(".roulette-window").clientWidth || 920;
  const loops = 7;

  const repeated = [];
  for (let i = 0; i < loops; i++) repeated.push(...shuffledTeams(available));

  track.innerHTML = repeated.map(t => `
    <div class="roulette-item" data-team-id="${t.id}">
      ${teamLogoImg(t, "")}
      <div class="rname">${t.name}</div>
    </div>
  `).join("");
  roulette.style.display = "";

  const randomOffset = Math.floor(Math.random() * available.length);
  const targetIndex = available.length * (loops - 2) + randomOffset;
  const chosen = repeated[targetIndex];

  const centerOffset = (WINDOW_WIDTH - ITEM_WIDTH) / 2;
  const finalTranslate = -(targetIndex * ITEM_WIDTH - centerOffset);

  track.style.transition = "none";
  track.style.transform = "translateX(0px)";
  void track.offsetWidth;

  const durationMs = 4200;
  track.style.transition = `transform ${durationMs}ms cubic-bezier(0.12, 0.85, 0.22, 1)`;
  track.style.transform = `translateX(${finalTranslate}px)`;

  const onEnd = (e) => {
    if (e.propertyName !== "transform") return;
    track.removeEventListener("transitionend", onEnd);

    Array.from(track.children).forEach(el => el.classList.remove("selected"));
    const sel = track.children[targetIndex];
    if (sel) sel.classList.add("selected");

    state.currentTeam = chosen;
    renderActiveTeamCard(chosen);
    document.getElementById("pick-label").textContent = `Pick ${state.pick} de 5 — Escolha 1 jogador`;

    if (state.rerollsLeft > 0 && !state.rerolledThisRound) {
      document.getElementById("reroll-btn").disabled = false;
      document.getElementById("reroll-count").textContent = `(${state.rerollsLeft} disponível)`;
    }
    renderPlayers(chosen);
  };
  track.addEventListener("transitionend", onEnd);
}

function reroll() {
  if (state.rerollsLeft <= 0 || state.rerolledThisRound || state.draftedThisRound) return;
  state.rerollsLeft--;
  state.rerolledThisRound = true;
  document.getElementById("reroll-btn").disabled = true;
  document.getElementById("reroll-count").textContent = `(${state.rerollsLeft} disponível)`;

  state.currentTeam = null;
  renderActiveTeamCard(null);
  document.getElementById("players-grid").style.display = "none";
  document.getElementById("pick-label").textContent = `Spin para o Pick ${state.pick} de 5`;
  document.getElementById("spin-btn").disabled = false;
}

function renderPlayers(team) {
  const grid = document.getElementById("players-grid");
  grid.style.display = "grid";
  grid.innerHTML = team.players.map((p, idx) => {
    const primaryRole = getPrimaryRole(p);

      : `<div class="player-photo-placeholder" style="font-size:48px">${displayRoleEmoji(p)}</div>`;

function pickPlayer(playerIdx, slotNum, e) {
  e.stopPropagation();
  if (state.draftedThisRound) return;

  const team = state.currentTeam;
  const player = { ...team.players[playerIdx], team: team.name };

  state.pickedPlayers.push(player);
  state.usedTeams.push(team.id);
  state.draftedThisRound = true;

  // Marca card como drafted
  document.getElementById("players-grid").querySelectorAll(".player-card").forEach((c, i) => {
    if (i === playerIdx) {
      c.classList.remove("available");
      c.classList.add("drafted");
      c.style.opacity = "1";
      c.style.border = "1.5px solid var(--accent)";
      c.style.boxShadow = "0 0 16px rgba(232,184,75,0.2)";
    } else {
      c.classList.add("drafted");
    }
  });

  document.getElementById("reroll-btn").disabled = true;

  renderSlotsBar();
  renderPickedRoster();
  renderScoreBar();
  renderPicksRow();

  if (state.pickedPlayers.length >= 5) {
    setTimeout(showResult, 900);
    return;
  }

  state.pick++;
  document.getElementById("hdr-pick").textContent = state.pick;

  // Próximo spin após delay
  setTimeout(() => {
    document.getElementById("spin-btn").disabled = false;
    document.getElementById("pick-label").textContent = `Spin para o Pick ${state.pick} de 5`;
    renderActiveTeamCard(null);
    state.currentTeam = null;
    document.getElementById("players-grid").style.display = "none";
  }, 700);

      name: "Sua Equipe",
      players: state.pickedPlayers,
      stage: "Custom"
    };

    const teams16 = getSwissBaseTeams();

    [draftedTeam, ...teams16].forEach(team => {

  const bracket = document.getElementById("playoffs-bracket");
  bracket.innerHTML = `<div style="text-align:center; color:var(--muted);">Simulando Playoffs...</div>`;

  // Delay para não travar a UI
  await new Promise(r => setTimeout(r, 100));

  // Criar playoff bracket
  const playoffs = new PlayoffsBracket(seededTeams);

  // Quartas
  const quarters = await playoffs.executeQuarters();
  await new Promise(r => setTimeout(r, 100));

  await new Promise(r => setTimeout(r, 100));

  // Final

  state.playoffsData = { playoffs, quarters, semis, final };

          <div style="width:44px; height:44px; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.25); border-radius:8px; flex-shrink:0;">
            ${renderTeamLogoImg(final.team1.team)}
          </div>
          <span style="flex:1; color:#fff; font-size:16px; font-weight:${final.match.winner === 'A' ? '700' : '400'}; text-align:center;">
            ${final.team1.team.name}
          </span>
          <span style="font-family:'Barlow Condensed'; font-size:28px; font-weight:900; color:${final.match.winner === 'A' ? 'var(--green)' : 'var(--muted)'}; min-width:30px; text-align:center;">
            ${final.match.score[0]}
          </span>
        </div>
        <div style="text-align:center; padding:6px 0; color:var(--muted); font-size:13px; border-top:1px solid rgba(255,255,255,0.06); border-bottom:1px solid rgba(255,255,255,0.06); margin-bottom:12px;">
          VS
        </div>
        <div style="display:flex; align-items:center; gap:12px; justify-content:center;">
          <div style="width:44px; height:44px; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.25); border-radius:8px; flex-shrink:0;">
            ${renderTeamLogoImg(final.team2.team)}
          </div>
          <span style="flex:1; color:#fff; font-size:16px; font-weight:${final.match.winner === 'B' ? '700' : '400'}; text-align:center;">
            ${final.team2.team.name}
          </span>
          <span style="font-family:'Barlow Condensed'; font-size:28px; font-weight:900; color:${final.match.winner === 'B' ? 'var(--green)' : 'var(--muted)'}; min-width:30px; text-align:center;">
            ${final.match.score[1]}
          </span>
        </div>
      </div>
    </div>
  `;

  const champion = final.match.winner === "A" ? final.team1 : final.team2;
  html += `
    <div style="text-align:center; margin:32px 0; padding:24px; background:rgba(74,222,128,0.08); border:1px solid rgba(74,222,128,0.25); border-radius:12px;">
      <div style="font-family:'Barlow Condensed'; font-size:12px; color:var(--green); text-transform:uppercase; letter-spacing:2px; margin-bottom:12px;">🏆 Campeão</div>
      <div style="display:flex; align-items:center; justify-content:center; gap:12px;">
        <div style="width:48px; height:48px; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.2); border-radius:8px; flex-shrink:0;">
          ${champion.team.logo ? `<img src="${champion.team.logo}" style="max-width:40px; max-height:40px; object-fit:contain;" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none'">` : ''}
        </div>
        <div style="font-family:'Barlow Condensed'; font-size:28px; font-weight:700; color:var(--green);">
          ${champion.team.name}
        </div>
      </div>
    </div>
  `;

  bracket.innerHTML = html;
}

  };

// ─────────────────────────────────────────────────────────────────
// TOURNAMENT SIMULATOR UI FUNCTIONS
// ─────────────────────────────────────────────────────────────────

function showTournamentSection() {
  const section = document.getElementById("tournament-section");
  if (section) section.style.display = "block";
}

function hideTournamentSection() {
  const section = document.getElementById("tournament-section");
  if (section) section.style.display = "none";
}

async function simulateTournamentUI() {
  // Pegar 16 equipes (ou menos se não tiver)
  let teams16 = getSwissBaseTeams();
  
  // Se a equipe draftada tem 5 jogadores, incluir ela
  if (state.pickedPlayers.length === 5) {
    const draftedTeam = {
      id: "drafted-team",
      name: "Sua Equipe",
      players: state.pickedPlayers,
      stage: "Custom"
    };
    teams16 = teams16.map(team => team.id === "monte" ? draftedTeam : team);
  }

  // Calcular Power Score para todos
  teams16.forEach(team => {
    if (!team.mapStrengths) {
      const mapStrengths = calculateTeamAllMapStrengths(team);
      team.mapStrengths = mapStrengths;
      team.powerScore = calculateTeamPowerScore(team, mapStrengths);
    }
  });

  // Executar simulação
  const tournament = await simulateCompleteTournament(teams16);

  // Mostrar resultados
  displayTournamentResults(tournament);
}

function displayTournamentResults(tournament) {
  const resultsDiv = document.getElementById("tournament-results");
  const contentDiv = document.getElementById("results-content");

  let html = `
    <div class="tournament-match" style="border-left-color: var(--green)">
      <div class="match-stage">🏆 Campeão</div>
      <div class="team-name"><strong>${tournament.champion.team.name}</strong></div>
      <div style="font-size: 11px; color: var(--muted); margin-top: 4px;">
        Seed #${tournament.champion.seed} · Record: ${tournament.champion.standing.wins}-${tournament.champion.standing.losses}
      </div>
    </div>
  `;

  // Semifinalistas
  const sfTeams = tournament.playoffs.semifinals.flat().map(s => s.team);
  if (sfTeams.length > 1) {
    html += `<div style="margin-bottom: 12px;"><strong style="color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: 1px;">Semifinalistas</strong></div>`;
    sfTeams.forEach(team => {
      if (team.id !== tournament.champion.team.id) {
        html += `<div class="tournament-match" style="border-left-color: var(--blue)">
          <div class="team-name">${team.name}</div>
        </div>`;
      }
    });
  }

  // Swiss Standings top 8
  html += `<div style="margin: 20px 0 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent);"><strong>Fase Swiss - Top 8</strong></div>`;
  html += `<table class="stats-table">
    <tr style="background: rgba(232,184,75,0.08)">
      <th>Time</th>
      <th>Record</th>
      <th>Power</th>
    </tr>`;

  tournament.swiss.standings.slice(0, 8).forEach((standing, idx) => {
    html += `<tr>
      <td>${idx + 1}. ${standing.team.name}</td>
      <td>${standing.wins}-${standing.losses}</td>
      <td><span class="stat-pct">${standing.team.powerScore}</span></td>
    </tr>`;
  });
  html += `</table>`;

  contentDiv.innerHTML = html;
  resultsDiv.style.display = "block";
}

function hideTournamentResults() {
  const resultsDiv = document.getElementById("tournament-results");
  if (resultsDiv) resultsDiv.style.display = "none";
}

async function showMultipleSimulationsUI() {
  // Pegar 16 equipes
  let teams16 = getSwissBaseTeams();
  
  if (state.pickedPlayers.length === 5) {
    const draftedTeam = {
      id: "drafted-team",
      name: "Sua Equipe",
      players: state.pickedPlayers,
      stage: "Custom"
    };
    teams16 = teams16.map(team => team.id === "monte" ? draftedTeam : team);
  }

  teams16.forEach(team => {
    if (!team.mapStrengths) {
      const mapStrengths = calculateTeamAllMapStrengths(team);
      team.mapStrengths = mapStrengths;
      team.powerScore = calculateTeamPowerScore(team, mapStrengths);
    }
  });

  // Executar 1000 simulações
  const stats = await runMultipleSimulations(teams16, 1000);

  displaySimulationStats(stats);
}

function displaySimulationStats(result) {
  const statsDiv = document.getElementById("simulation-stats");
  const contentDiv = document.getElementById("stats-content");

  let html = `<table class="stats-table">
    <tr>
      <th>Time</th>
      <th>Playoffs</th>
      <th>Semifinal</th>
      <th>Final</th>
      <th>Campeão</th>
    </tr>`;

  // Ordenar por chance de campeonato
  const sorted = Object.entries(result.stats).sort((a, b) => 
    parseFloat(b[1].championPct) - parseFloat(a[1].championPct)
  );

  sorted.forEach(([teamId, stats]) => {
    html += `<tr>
      <td>${stats.name}</td>
      <td><span class="stat-pct">${stats.playoffsQualifiedPct}%</span></td>
      <td><span class="stat-pct">${stats.semiFinalsPct}%</span></td>
      <td><span class="stat-pct">${stats.finalsPct}%</span></td>
      <td><span class="stat-pct">${stats.championPct}%</span></td>
    </tr>`;
  });

  html += `</table>`;
  html += `<p style="margin-top: 16px; font-size: 12px; color: var(--muted);">Baseado em ${result.iterations} simulações</p>`;

  contentDiv.innerHTML = html;
  statsDiv.style.display = "block";
}

function hideSimulationStats() {
  const statsDiv = document.getElementById("simulation-stats");
  if (statsDiv) statsDiv.style.display = "none";
}

renderPicksRow();
